[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "colearn"
version = "0.1.0"
description = "CoLearn plugin runtime for NanoBot"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Yi Xie" }
]
dependencies = [
    "pyyaml>=6.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["colearn*"]

