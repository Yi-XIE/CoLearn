[pytest]
testpaths = tests
# Run async test functions through anyio's pytest plugin in auto mode: every
# ``async def`` test is collected and executed (asyncio backend below) without
# per-test markers. pytest-asyncio is not installable in this environment, and
# anyio already ships a pytest plugin, so we lean on it. Without this, async
# tests are silently skipped rather than run.
anyio_mode = auto
